name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        env:
          DB_DIAL_SECRET: ${{ secrets.DB_DIALECT }}
          DB_HOST_SECRET: ${{ secrets.DB_HOST }}
          DB_NAME_SECRET: ${{ secrets.POSTGRES_DB }}
          DB_PASS_SECRET: ${{ secrets.POSTGRES_PASSWORD }}
          DB_PORT_SECRET: ${{ secrets.POSTGRES_PORT }}
          DB_USER_SECRET: ${{ secrets.POSTGRES_USER }}
        run: |
          docker --debug build . \
            --build-arg DB_DIALECT="$DB_DIAL_SECRET" \
            --build-arg DB_HOST="$DB_HOST_SECRET" \
            --build-arg POSTGRES_DB="$DB_NAME_SECRET" \
            --build-arg POSTGRES_PASSWORD="$DB_PASS_SECRET" \
            --build-arg DB_PORT="$DB_PORT_SECRET" \
            --build-arg POSTGRES_USER="$DB_USER_SECRET" \
            --file Dockerfile \
            --tag hangman:$(date +%s)
